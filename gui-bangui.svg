<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="680" height="360" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Header Bar -->
  <rect x="10" y="10" width="680" height="50" rx="12" fill="#0f172a" />
  <rect x="10" y="50" width="680" height="10" fill="#0f172a" />
  <text x="35" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">🔨 StaffPlus - Panel Gráfico de Sanciones (/bangui)</text>

  <!-- Mode Selector Section -->
  <rect x="35" y="80" width="630" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="50" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Tipo de Sanción:</text>
  
  <rect x="180" y="90" width="160" height="40" rx="6" fill="#059669" />
  <text x="200" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">👤 Ban a Jugador</text>
  
  <rect x="360" y="90" width="160" height="40" rx="6" fill="#dc2626" />
  <text x="385" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">🌐 Ban de IP</text>

  <!-- Durations Row -->
  <text x="35" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cbd5e1">⏱️ Duraciones Rápidas:</text>
  <g transform="translate(35, 185)">
    <!-- 1 Hora -->
    <rect x="0" y="0" width="110" height="45" rx="6" fill="#334155" stroke="#64748b" />
    <text x="30" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">1 Hora</text>

    <!-- 1 Día -->
    <rect x="130" y="0" width="110" height="45" rx="6" fill="#334155" stroke="#64748b" />
    <text x="163" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">1 Día</text>

    <!-- 7 Días -->
    <rect x="260" y="0" width="110" height="45" rx="6" fill="#334155" stroke="#64748b" />
    <text x="290" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">7 Días</text>

    <!-- 30 Días -->
    <rect x="390" y="0" width="110" height="45" rx="6" fill="#334155" stroke="#64748b" />
    <text x="415" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">30 Días</text>

    <!-- Permanente -->
    <rect x="520" y="0" width="110" height="45" rx="6" fill="#991b1b" stroke="#ef4444" stroke-width="1.5" />
    <text x="532" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fef2f2">🚫 Permanente</text>
  </g>

  <!-- Reasons Preset Row -->
  <text x="35" y="265" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cbd5e1">📋 Motivos Predefinidos:</text>
  <g transform="translate(35, 280)">
    <rect x="0" y="0" width="145" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" />
    <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#93c5fd">⚔️ Hacks / Cheats</text>

    <rect x="160" y="0" width="145" height="40" rx="6" fill="#1e293b" stroke="#eab308" />
    <text x="180" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#fde047">💬 Toxicidad / Spam</text>

    <rect x="320" y="0" width="145" height="40" rx="6" fill="#1e293b" stroke="#f97316" />
    <text x="340" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#fdba74">⚠️ Acoso Severo</text>

    <rect x="480" y="0" width="150" height="40" rx="6" fill="#1e293b" stroke="#a855f7" />
    <text x="495" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#d8b4fe">🐛 Abuso de Bugs</text>
  </g>

  <!-- Footer Tip -->
  <text x="35" y="350" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">💡 Haz clic en cualquier botón de la interfaz para aplicar la sanción instantáneamente sin comandos.</text>
</svg>

