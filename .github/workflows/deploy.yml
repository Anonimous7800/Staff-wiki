name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sincronización automática de nuevas versiones cada 6 horas
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [new-release, plugin-update]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        run: npm run docs:build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist

      - name: Notify Discord on deployment
        if: success()
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{
            "embeds": [
              {
                "title": "🚀 StaffPlus Wiki Desplegada",
                "description": "La documentación de **StaffPlus** se ha compilado y desplegado con éxito en GitHub Pages.\n\n🌐 **Sitio Web:** https://anonimous7800.github.io/Staff-wiki/",
                "color": 1098673,
                "footer": {
                  "text": "GitHub Actions • Staff-wiki"
                }
              }
            ]
          }' https://discord.com/api/webhooks/1566588679965642804/jYD8VXDRasQRovhusjJSQprGhYbAsHupPXnvpdxtVxda2BDIraI86TyFmfyGoiEkrYIh
