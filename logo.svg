<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Shield Base -->
  <path d="M100 15 L165 45 C165 110 135 155 100 185 C65 155 35 110 35 45 Z" fill="url(#shieldGrad)" filter="url(#shadow)" stroke="#34d399" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Inner Shield Inset -->
  <path d="M100 28 L152 52 C152 105 128 142 100 168 C72 142 48 105 48 52 Z" fill="#064e3b" opacity="0.45" />

  <!-- Moderation Star / Cross Symbol -->
  <g transform="translate(100, 100)">
    <!-- Vertical Bar -->
    <rect x="-9" y="-45" width="18" height="90" rx="6" fill="url(#goldGrad)" />
    <!-- Horizontal Bar -->
    <rect x="-45" y="-9" width="90" height="18" rx="6" fill="url(#goldGrad)" />
    <!-- Central Jewel -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="8" fill="#10b981" />
  </g>
  
  <!-- Plus Sign Accent -->
  <path d="M145 35 L145 55 M135 45 L155 45" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
</svg>

