<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <text x="30" y="35" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">⚡ Flujo Operativo del Equipo de Moderación</text>

  <!-- Step 1: Detection -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="160" height="160" rx="10" fill="url(#flowBg)" stroke="#f59e0b" stroke-width="2" />
    <text x="65" y="45" font-size="28">🚨</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fde68a">1. Detección</text>
    <text x="15" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Reporte (/report)</text>
    <text x="15" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Alerta X-Ray / Ores</text>
    <text x="15" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Chat Blacklist</text>
  </g>

  <!-- Arrow -->
  <path d="M205 140 L235 140 M225 130 L235 140 L225 150" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Step 2: Investigation -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="160" height="160" rx="10" fill="url(#flowBg)" stroke="#10b981" stroke-width="2" />
    <text x="65" y="45" font-size="28">🛡️</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#a7f3d0">2. Vigilancia</text>
    <text x="15" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Activar /staff</text>
    <text x="15" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Vanish Total invisible</text>
    <text x="15" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Teleport directo (RTP)</text>
  </g>

  <!-- Arrow -->
  <path d="M425 140 L455 140 M445 130 L455 140 L445 150" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Step 3: Audit -->
  <g transform="translate(470, 60)">
    <rect x="0" y="0" width="160" height="160" rx="10" fill="url(#flowBg)" stroke="#06b6d4" stroke-width="2" />
    <text x="65" y="45" font-size="28">🔍</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#a5f3fc">3. Auditoría</text>
    <text x="15" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• /examine (Inventario)</text>
    <text x="15" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• /cps (Autoclicker)</text>
    <text x="15" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• /freeze (Congelar)</text>
  </g>

  <!-- Arrow -->
  <path d="M645 140 L675 140 M665 130 L675 140 L665 150" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Step 4: Resolution -->
  <g transform="translate(690, 60)">
    <rect x="0" y="0" width="130" height="160" rx="10" fill="url(#flowBg)" stroke="#ef4444" stroke-width="2" />
    <text x="50" y="45" font-size="28">🔨</text>
    <text x="18" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fca5a5">4. Sanción</text>
    <text x="12" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• /bangui</text>
    <text x="12" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• /tempban /banip</text>
    <text x="12" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• /warn acumular</text>
  </g>
</svg>
