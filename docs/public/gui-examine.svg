<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <linearGradient id="exBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="680" height="380" rx="12" fill="url(#exBg)" stroke="#334155" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="10" y="10" width="680" height="50" rx="12" fill="#0f172a" />
  <text x="35" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">🔍 StaffPlus - Inspección de Jugador (/examine)</text>

  <!-- Player Main Inventory Grid Placeholder -->
  <rect x="35" y="75" width="630" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="50" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">🎒 Inventario en Vivo (36 Casillas + Armadura + Mano Izquierda)</text>
  
  <!-- Inventory visual slots sample -->
  <g transform="translate(50, 125)">
    <rect x="0" y="0" width="55" height="55" rx="6" fill="#334155" stroke="#64748b" /><text x="12" y="34" font-size="20">🗡️</text>
    <rect x="65" y="0" width="55" height="55" rx="6" fill="#334155" stroke="#64748b" /><text x="77" y="34" font-size="20">🏹</text>
    <rect x="130" y="0" width="55" height="55" rx="6" fill="#334155" stroke="#64748b" /><text x="142" y="34" font-size="20">⛏️</text>
    <rect x="195" y="0" width="55" height="55" rx="6" fill="#334155" stroke="#64748b" /><text x="207" y="34" font-size="20">🥩</text>
    <rect x="260" y="0" width="55" height="55" rx="6" fill="#334155" stroke="#64748b" /><text x="272" y="34" font-size="20">🧪</text>
    <rect x="325" y="0" width="55" height="55" rx="6" fill="#334155" stroke="#64748b" /><text x="337" y="34" font-size="20">💎</text>
    
    <!-- Armor sample -->
    <rect x="420" y="0" width="45" height="55" rx="6" fill="#1e3a5f" stroke="#3b82f6" /><text x="430" y="34" font-size="18">🪖</text>
    <rect x="470" y="0" width="45" height="55" rx="6" fill="#1e3a5f" stroke="#3b82f6" /><text x="480" y="34" font-size="18">🦺</text>
    <rect x="520" y="0" width="45" height="55" rx="6" fill="#1e3a5f" stroke="#3b82f6" /><text x="530" y="34" font-size="18">👖</text>
    <rect x="570" y="0" width="45" height="55" rx="6" fill="#1e3a5f" stroke="#3b82f6" /><text x="580" y="34" font-size="18">👢</text>
  </g>

  <!-- Lower Action Bar Section (Row 6) -->
  <text x="35" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cbd5e1">⚡ Barra de Diagnóstico y Acciones Rápidas:</text>

  <g transform="translate(35, 270)">
    <!-- Food/HP -->
    <rect x="0" y="0" width="65" height="60" rx="6" fill="#1e293b" stroke="#475569" /><text x="22" y="32" font-size="18">❤️</text><text x="14" y="52" font-size="10" fill="#94a3b8">Salud/HP</text>
    <!-- IP -->
    <rect x="70" y="0" width="65" height="60" rx="6" fill="#1e293b" stroke="#475569" /><text x="92" y="32" font-size="18">🌐</text><text x="86" y="52" font-size="10" fill="#94a3b8">IP Info</text>
    <!-- Ping -->
    <rect x="140" y="0" width="65" height="60" rx="6" fill="#1e293b" stroke="#475569" /><text x="162" y="32" font-size="18">📶</text><text x="157" y="52" font-size="10" fill="#94a3b8">Ping ms</text>
    <!-- Gamemode -->
    <rect x="210" y="0" width="65" height="60" rx="6" fill="#1e293b" stroke="#475569" /><text x="232" y="32" font-size="18">🎮</text><text x="225" y="52" font-size="10" fill="#94a3b8">Modo</text>
    <!-- Warns -->
    <rect x="280" y="0" width="65" height="60" rx="6" fill="#1e293b" stroke="#475569" /><text x="302" y="32" font-size="18">⚠️</text><text x="295" y="52" font-size="10" fill="#94a3b8">Warns</text>
    <!-- Coords/TP -->
    <rect x="350" y="0" width="65" height="60" rx="6" fill="#1e293b" stroke="#475569" /><text x="372" y="32" font-size="18">📍</text><text x="360" y="52" font-size="10" fill="#94a3b8">TP Coords</text>
    <!-- Notes -->
    <rect x="420" y="0" width="65" height="60" rx="6" fill="#1e293b" stroke="#475569" /><text x="442" y="32" font-size="18">📝</text><text x="435" y="52" font-size="10" fill="#94a3b8">Notas</text>
    <!-- Freeze -->
    <rect x="490" y="0" width="65" height="60" rx="6" fill="#0891b2" stroke="#06b6d4" /><text x="512" y="32" font-size="18">❄️</text><text x="502" y="52" font-size="10" fill="#ffffff" font-weight="bold">Freeze</text>
    <!-- Ban -->
    <rect x="565" y="0" width="65" height="60" rx="6" fill="#b91c1c" stroke="#ef4444" /><text x="587" y="32" font-size="18">🔨</text><text x="580" y="52" font-size="10" fill="#ffffff" font-weight="bold">Banear</text>
  </g>

  <text x="35" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">🛡️ Haz clic en "Freeze" o "Banear" directamente para actuar sobre el jugador inspeccionado.</text>
</svg>
